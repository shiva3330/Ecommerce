server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-service

app:
  payment:
    provider-base-url: ${PAYMENT_PROVIDER_BASE_URL:https://sandbox.invalid}
    api-key: ${PAYMENT_PROVIDER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
